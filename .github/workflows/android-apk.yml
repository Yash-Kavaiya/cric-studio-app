name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Default installs the removed 'tools' package and fails.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      # The repo has no Gradle wrapper, so pin the version used locally.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.3.1"

      # app/build.gradle.kts signs debug + release with ${rootDir}/debug.keystore,
      # which is not committed. Use the DEBUG_KEYSTORE_BASE64 secret if set
      # (stable signature across builds), otherwise generate a throwaway one.
      - name: Prepare signing keystore
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > debug.keystore
          else
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug and release APKs
        run: gradle --no-daemon :app:assembleDebug :app:assembleRelease

      - name: Rename APKs
        run: |
          mkdir -p dist-apk
          SHA=$(git rev-parse --short HEAD)
          cp app/build/outputs/apk/debug/*.apk   "dist-apk/CricStudio-debug-${SHA}.apk"
          cp app/build/outputs/apk/release/*.apk "dist-apk/CricStudio-release-${SHA}.apk"
          ls -la dist-apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CricStudio-apk
          path: dist-apk/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APKs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-apk/*.apk
